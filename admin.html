
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEHRA MART | Admin</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #211914;
      color: #f5eee5;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: min(360px, 85%);
      padding: 28px;
      border: 1px solid #80634c;
      border-radius: 14px;
      background: #30251e;
    }
    h1 {
      letter-spacing: 3px;
      text-align: center;
    }
    p { color: #d2c0ad; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 15px;
    }
    input {
      background: #fffaf4;
      border: 1px solid #bba58e;
    }
    button {
      border: 0;
      background: #c6a477;
      color: #211914;
      font-weight: bold;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>MEHRA MART</h1>
    <p style="text-align:center">ADMIN LOGIN</p>
    <p>Enter your admin mobile number with country code.</p>

    <input id="phone" type="tel" placeholder="+91XXXXXXXXXX">
    <div id="recaptcha-container"></div>
    <button id="send">Send OTP</button>

    <input id="otp" type="text" inputmode="numeric"
           placeholder="Enter OTP" autocomplete="one-time-code">
    <button id="verify">Verify & Login</button>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getAuth, RecaptchaVerifier, signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBD1yJa-dMgvfs9o8lCUNm_h1mDtYQfoG0",
      authDomain: "mehra-mart.firebaseapp.com",
      projectId: "mehra-mart",
      storageBucket: "mehra-mart.firebasestorage.app",
      messagingSenderId: "569277039979",
      appId: "1:569277039979:web:cf670312b5c50befe1782e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const status = document.getElementById("status");
    let confirmation = null;
    let verifier = null;

    document.getElementById("send").onclick = async () => {
      try {
        const phone = document.getElementById("phone").value.trim();
        if (!phone.startsWith("+")) {
          status.textContent = "Use country code, e.g. +91...";
          return;
        }
        status.textContent = "Preparing secure verification...";
        if (!verifier) {
          verifier = new RecaptchaVerifier(auth, "recaptcha-container", {});
        }
        confirmation = await signInWithPhoneNumber(auth, phone, verifier);
        status.textContent = "OTP sent if Firebase accepted the request.";
      } catch (error) {
        status.textContent = error.message;
        if (verifier) {
          verifier.clear();
          verifier = null;
        }
      }
    };

    document.getElementById("verify").onclick = async () => {
      try {
        if (!confirmation) {
          status.textContent = "First request an OTP.";
          return;
        }
        const code = document.getElementById("otp").value.trim();
        const result = await confirmation.confirm(code);
        status.textContent =
          "Login successful. UID: " + result.user.uid +
          ". Save this UID privately for the next security step.";
      } catch (error) {
        status.textContent = "Verification failed: " + error.message;
      }
    };
  </script>
</body>
</html>
