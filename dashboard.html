
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEHRA MART | Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #211914;
      color: #f5eee5;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
    }
    h1 {
      letter-spacing: 3px;
      color: #c6a477;
    }
    .card {
      background: #30251e;
      border: 1px solid #80634c;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
    }
    p { color: #d2c0ad; }
    a {
      display: inline-block;
      margin-top: 10px;
      color: #211914;
      background: #c6a477;
      padding: 12px 16px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>MEHRA MART</h1>
    <p>ADMIN DASHBOARD</p>

    <section class="card">
      <h2>Product Management</h2>
      <p>Manage clothing products, prices and descriptions.</p>
      <p>Product editing is not enabled yet.</p>
    </section>

    <section class="card">
      <h2>Order Management</h2>
      <p>Customer order management will be added next.</p>
    </section>

<section class="card">
  <h2>Add New Product</h2>

  <form id="add-product-form">
    <label for="product-name">Product Name</label>
    <input id="product-name" type="text"
      placeholder="e.g. Men's Cotton Shirt" required>

    <label for="product-price">Price (₹)</label>
    <input id="product-price" type="number"
      min="1" step="1" placeholder="599" required>

    <label for="product-category">Category</label>
    <select id="product-category" required>
      <option value="">Choose category</option>
      <option value="Men">Men</option>
      <option value="Women">Women</option>
    </select>

    <label for="product-description">Description</label>
    <textarea id="product-description"
      placeholder="Enter product details" required></textarea>

    <button type="submit">Add Product</button>
    <p id="product-status" role="status"></p>
  </form>
</section>

    <a href="index.html">View Shopping Website</a>
  </main>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBD1yJa-dMgvfs9o8lCUNm_h1mDtYQfoG0",
    authDomain: "mehra-mart.firebaseapp.com",
    projectId: "mehra-mart",
    storageBucket: "mehra-mart.firebasestorage.app",
    messagingSenderId: "569277039979",
    appId: "1:569277039979:web:cf670312b5c50befe1782e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
const db = getFirestore(app);
  
document.getElementById("add-product-form").addEventListener("submit", async (event) => {
  event.preventDefault();

  const status = document.getElementById("product-status");
  const name = document.getElementById("product-name").value.trim();
  const price = Number(document.getElementById("product-price").value);
  const category = document.getElementById("product-category").value;
  const description = document.getElementById("product-description").value.trim();

  if (!name || !description || !category || !Number.isFinite(price) || price <= 0) {
    status.textContent = "Please enter valid product details.";
    return;
  }

  status.textContent = "Saving product...";

  try {
    await addDoc(collection(db, "products"), {
      name: name,
      price: price,
      category: category,
      description: description,
      active: true
    });

    status.textContent = "Product added successfully!";
    document.getElementById("add-product-form").reset();
  } catch (error) {
    console.error("Add product error:", error);
    status.textContent = "Could not add product: " + error.message;
  }
});

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace("admin.html");
      return;
    }

    if (user.uid !== "viNPcFUTHsSGf1mNATnIcYIQTO52") {
      await signOut(auth);
      window.location.replace("admin.html");
    }
  });
</script>
</body>
</html>

</body>
</html>
